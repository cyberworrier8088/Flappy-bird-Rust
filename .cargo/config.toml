# .cargo/config.toml

# For Linux users (Uses mold, the absolute fastest linker out there right now)
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# For Windows users (Uses lld which comes bundled with Rust tools)
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]